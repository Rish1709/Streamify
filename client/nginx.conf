# Serves the SPA and reverse-proxies the API + Socket.IO on the same origin, so the
# httpOnly auth cookie is first-party and no CORS is needed in production.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Let range requests and audio streaming pass straight through.
    proxy_buffering off;
  }

  location /socket.io/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # Fingerprinted build assets can be cached forever.
  location /assets/ {
    expires 1y;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: client-side routes resolve to index.html.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
