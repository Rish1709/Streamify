# Full local stack: MongoDB + Redis + API + web client.
#   cp .env.example .env   # then set JWT_SECRET
#   docker compose up --build
#   open http://localhost:8080
#
# Only the dependencies (for running the API/client with npm on your machine):
#   docker compose up -d mongo redis
services:
  mongo:
    image: mongo:8
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/streamify
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      # Local Docker serves plain http://localhost, so Secure cookies would be dropped.
      # Set to true (or remove) when serving over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SEED_ON_START: ${SEED_ON_START:-true}
    volumes:
      - audio:/app/server/storage
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo-data:
  audio:
